[workspace]
resolver = "3"
members = ["crates/kybersync-core", "crates/kybersync-server", "crates/kybersync-client"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1.8"
chacha20poly1305 = "0.11"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
getrandom = "0.3"
hex = "0.4"
ml-kem = { version = "0.3", default-features = false, features = ["alloc"] }
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = { version = "1", features = ["derive"] }

[patch.crates-io]
# Vendored copy that uses pre-generated bindings (no libclang needed).
winfsp-sys = { path = "vendor/winfsp-sys" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
