# Builds the Windows client and the server image.
#
# Push a tag like `v0.2.0` to publish: the client zip is attached to a GitHub
# release and the server image is pushed to ghcr.io/<owner>/kybersync with the
# version, major.minor and (for non-prerelease tags) `latest` tags.
# Running it by hand from the Actions tab builds the same things, keeps the
# client zip as a workflow artifact and pushes the image tagged with the commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  client:
    name: Windows client
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p kybersync-client

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          $name = "kybersync-$version-windows-x64"
          $dir = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/kybersync.exe, ../LICENSE, ../README.md $dir
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  server:
    name: Server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kybersync
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - uses: docker/build-push-action@v6
        env:
          # Don't upload the build record as a workflow artifact; the release
          # job only wants the client zip.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: src
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            KYBERSYNC_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [client, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kybersync-*-windows-x64
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
