# Builds the Windows client and the server image.
#
# The server image is multi-arch (linux/amd64 + linux/arm64): each architecture
# builds in parallel on a native runner and is pushed by digest, then the
# server-manifest job merges the digests into one manifest list under the tags.
#
# Push a tag like `v0.2.0` to publish: the client zip is attached to a GitHub
# release and the server image is pushed to ghcr.io/<owner>/kybersync with the
# version, major.minor and (for non-prerelease tags) `latest` tags. Nothing is
# tagged or released until someone approves the `release` environment in the
# run's page on GitHub (the builds run while it waits).
# Running it by hand from the Actions tab builds the same things, keeps the
# client zip as a workflow artifact and pushes the image tagged with the commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Manual sign-off for tag releases: the `release` environment requires a
  # reviewer. Hand-started runs skip it.
  approve:
    name: Approve release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - run: echo "Release ${{ github.ref_name }} approved"

  client:
    name: Windows client
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src

      - name: Test
        run: cargo test --workspace --locked

      - name: Build
        run: cargo build --release --locked -p kybersync-client

      - name: Package
        id: package
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 7) }
          $name = "kybersync-$version-windows-x64"
          $dir = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item target/release/kybersync.exe, ../LICENSE, ../README.md $dir
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error

  server:
    name: Server image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tags as server-manifest so the labels (version, revision) agree.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kybersync
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # Push this architecture by digest only (no tags); the server-manifest
      # job ties the per-arch digests together under the real tags.
      - id: build
        uses: docker/build-push-action@v6
        env:
          # Don't upload the build record as a workflow artifact; the release
          # job only wants the client zip.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: src
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/kybersync,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            KYBERSYNC_VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,scope=server-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: server-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  server-manifest:
    name: Server image (multi-arch)
    needs: [server, approve]
    # `approve` is skipped for hand-started runs; any failure (or a rejected
    # approval) stops the tags from being published.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/kybersync
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/kybersync
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository_owner }}/kybersync:${{ steps.meta.outputs.version }}"

  release:
    name: GitHub release
    if: github.ref_type == 'tag'
    needs: [client, server-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: kybersync-*-windows-x64
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
